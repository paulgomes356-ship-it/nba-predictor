[theme]
# Vibrant basketball orange for buttons, radio selections, and accents
primaryColor = "#FF5722"

# Crisp off-white for the main background
backgroundColor = "#F8F9FA"

# Pure white for sidebars and input fields
secondaryBackgroundColor = "#FFFFFF"

# Dark, near-black text for sharp readability
textColor = "#111111"
font = "sans serif"