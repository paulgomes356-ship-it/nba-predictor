[theme]
# Muted blue accent for minimal distraction
primaryColor = "#4A90E2"

# Deep matte charcoal for the background
backgroundColor = "#121212"

# Slightly lighter matte for sidebars/menus
secondaryBackgroundColor = "#1E1E1E"

# Off-white text for less eye strain
textColor = "#E0E0E0"
font = "sans serif"